<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>German grammar corrections</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 2rem;
      background: #f8fafc;
      color: #1e293b;
    }

    .grammar-result {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .correction-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1.5rem;
      padding: 1rem 1.25rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.05);
    }

    .correction-text {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .wrong {
      color: #b91c1c;
      text-decoration: line-through;
    }

    .right {
      color: #15803d;
      font-weight: 700;
    }

    .translation {
      margin: 0;
      color: #64748b;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      body {
        padding: 1rem;
      }

      .correction-row {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <section class="grammar-result">
    <div class="correction-row">
      <span class="correction-text">Der Professor hat der Studentin die Grammatik erklärt</span>
      <p class="translation">Професор пояснив студентці граматику.</p>
    </div>
    <div class="correction-row">
      <span class="correction-text">Die Mutter hat dem Sohn das Handy gekauft</span>
      <p class="translation">Мати купила синові телефон.</p>
    </div>
    <div class="correction-row">
      <span class="correction-text">Ich habe der Oma die Postkarte geschickt</span>
      <p class="translation">Я надіслав(ла) бабусі листівку.</p>
    </div>
  </section>
</body>
</html>
